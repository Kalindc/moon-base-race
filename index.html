<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moon Base Race</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: mission-control console. Sticky mission clock on top, one cutscene screen, decisions beneath it. Single dark look by choice. */
:root{
  color-scheme:dark;
  --void:#0b0d12; --panel:#141821; --panel2:#1c212c; --line:#2c3341;
  --dust:#c9c4b8; --dim:#8b8f99; --sun:#f2b84b; --go:#6fd08c; --halt:#ff5a4d; --ice:#7fc8e8;
  --display:"Chakra Petch","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--void)}
body{color:var(--dust);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--void)}
.wrap{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--void);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding-block:10px}
h1{font-family:var(--display);font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin:0;color:#fff}
.clock{font-family:var(--mono);font-size:13px;display:flex;gap:16px;flex-wrap:wrap;margin-left:auto}
.clock b{color:var(--sun);font-weight:600}.clock .cn b{color:var(--halt)}

.tl .track{position:absolute;left:0;right:0;top:5px;height:4px;background:var(--panel2);border-radius:2px}
.tl .fill{position:absolute;left:0;top:5px;height:4px;background:var(--sun);border-radius:2px;transition:width .6s}
.tl .mk{position:absolute;top:0;width:2px;height:14px;background:var(--dim)}
.tl .mk.cn{background:var(--halt);width:3px}
.tl .mk span{position:absolute;top:14px;left:0;font:11px var(--mono);color:var(--dim);white-space:nowrap}
.tl .mk.cn span{left:auto;right:0;display:block;color:var(--halt)}
nav{display:flex;gap:4px;padding-bottom:8px}
nav button{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid transparent;color:var(--dim);padding:6px 12px;border-radius:4px;cursor:pointer}
nav button[aria-selected=true]{color:#fff;border-color:var(--line);background:var(--panel)}
main{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.screen canvas,.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.screen .tag{position:absolute;left:10px;top:10px;font:11px var(--mono);background:rgba(0,0,0,.6);color:var(--dim);padding:3px 7px;border-radius:3px;max-width:calc(100% - 20px)}
.screen .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-family:var(--display);font-size:clamp(16px,3vw,26px);color:#fff;text-wrap:balance}
.step{font:12px var(--mono);color:var(--sun);letter-spacing:.08em;text-transform:uppercase}
h2{font-family:var(--display);font-size:22px;margin:2px 0 6px;color:#fff;text-wrap:balance}
h3{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:14px 0 8px}
p{margin:0 0 8px;max-width:68ch}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px}
@media(max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}.tl .mk span{display:none}}td.n{white-space:normal;min-width:9ch}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 12px;color:inherit;font:inherit;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--dim)}
.opt[aria-pressed=true]{border-color:var(--sun);background:var(--panel2)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt .box{flex:none;width:16px;height:16px;border:2px solid var(--dim);border-radius:3px;margin-top:3px}
.opt.radio .box{border-radius:50%}
.opt[aria-pressed=true] .box{background:var(--sun);border-color:var(--sun)}
.opt strong{display:block;color:#fff;font-weight:600}
.opt small{display:block;color:var(--dim);font-size:13px}
.opt .m{font:12px var(--mono);color:var(--ice)}
.meter{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--go)}
.meter.over i{background:var(--halt)}
.mono{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px var(--mono);border:1px solid var(--line);border-radius:20px;padding:2px 10px;color:var(--dim)}
.chip.on{border-color:var(--go);color:var(--go)}
.btn{font:700 14px var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--sun);color:#1a1405;border:0;border-radius:4px;padding:10px 20px;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--dust);border:1px solid var(--line)}
.btn.small{font-size:12px;padding:6px 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;align-self:start}
aside ul{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:4px}
aside{min-width:0}aside li{display:flex;justify-content:space-between;gap:8px}aside li span:first-child{min-width:0;overflow-wrap:anywhere}
aside li span:last-child{font-family:var(--mono);color:var(--dim);white-space:nowrap}
.res{border-left:3px solid var(--go);padding-left:12px}.res.bad{border-color:var(--halt)}
.res .big{font-family:var(--display);font-size:20px;color:var(--go)}.res.bad .big{color:var(--halt)}
textarea,input[type=text],select{width:100%;background:var(--panel);color:var(--dust);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font:13px var(--mono)}
textarea{min-height:120px;resize:vertical}
textarea.json{min-height:320px;white-space:pre;overflow:auto}
label{display:block;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 4px}
.note{font-size:13px;color:var(--dim)}
.msg{font:13px var(--mono);color:var(--ice);min-height:1.4em}
.msg.err{color:var(--halt)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
a{color:var(--ice)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.props{display:flex;flex-direction:column;gap:8px}
.race{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;margin-bottom:4px;font:11px var(--mono);color:var(--dim)}
.race .rb{position:relative;height:14px}
.race .track{position:absolute;left:0;right:0;top:5px;height:4px;background:var(--panel2);border-radius:2px}
.race .fill{position:absolute;left:0;top:5px;height:4px;background:var(--sun);border-radius:2px;transition:width .6s}
.race .cn .fill{background:var(--halt)}
.race .mk{position:absolute;top:0;width:2px;height:14px;background:var(--dim)}
.race .cn .mk{background:var(--line);width:3px}.race .cn .mk.hit{background:var(--halt)}
.race .mk.end{background:var(--halt);width:3px}
.racenote{font:11px var(--mono);color:var(--dim);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 16px}
.racenote b{color:var(--halt);font-weight:400}
nav{align-items:center;flex-wrap:wrap}
nav .sp{flex:1}
nav button.tog{font-size:11px;padding:4px 10px;border-color:var(--line)}
nav button.tog[aria-pressed=true]{color:var(--go);border-color:var(--go)}
.map{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:4px;background:#17181c}
.insight{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ice);border-radius:4px;padding:10px 14px;max-width:68ch;margin-top:12px}
.insight h3{margin:0 0 4px;color:var(--ice)}
.notes{margin:0 0 8px;padding-left:18px;color:var(--sun);font-size:14px;max-width:68ch}
.stat{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.res.soft{border-color:var(--sun)}.res.soft .big{color:var(--sun)}
.opt .r{font:12px var(--mono);color:var(--sun)}
aside li span.c{color:var(--ice)}
aside li span:only-child{white-space:normal;font-family:var(--body);color:var(--dust)}
.mani{display:flex;gap:14px;align-items:center;margin:8px 0 4px}
.mani .pic{flex:none;width:84px}.mani svg{display:block;width:100%;height:auto}
.bay{display:flex;height:12px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:6px 0 4px;border:1px solid var(--line)}
.bay.over{border-color:var(--halt)}.bay i{display:block;height:100%}
.load{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px}
.load .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

.opt .cap{font-size:12px;color:var(--dim)}
.opt .ben{font-size:13px;color:var(--dust)}
.opt .fx{font:12px var(--mono);color:var(--go)}
.opt .dev{font:12px var(--mono);color:var(--ice)}
.cls{display:inline-block;margin-left:8px;padding:0 6px;border:1px solid var(--line);border-radius:3px;font:10px var(--mono);color:var(--dim);vertical-align:middle;text-transform:uppercase;letter-spacing:.04em}
.cls.niac{color:var(--ice);border-color:var(--ice)}

.screen .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.screen .art.ok{opacity:1}
.ths{display:flex;gap:4px;margin-bottom:6px}
.th{display:block;flex:1;min-width:0;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:3px;background:var(--panel2);opacity:.25;transition:opacity .3s}
.th.ok{opacity:1}
@media(max-width:640px){header{position:static}.clock{gap:2px 12px;font-size:12px}nav button{padding:6px 8px}.mani{flex-direction:column;align-items:stretch}.mani .pic{width:64px}}
</style>
<header><div class="wrap">
  <div class="bar"><h1>Moon Base Race</h1>
    <div class="clock"><span>Mission date <b id="cDate"></b></span><span>Elapsed <b id="cEl"></b></span><span>Funds <b id="cBud"></b></span><span class="cn">Deadline <b id="cCn"></b></span></div></div>
  <div class="race" id="tl"></div><div class="racenote" id="tln"></div>
  <nav><button role="tab" id="tabPlay" data-tab="play">Play</button><button role="tab" id="tabEdit" data-tab="edit">Scene editor</button><button role="tab" id="tabData" data-tab="data">Data and sources</button><span class="sp"></span><button class="tog" id="tSound" aria-pressed="false">Sound</button><button class="tog" id="tVoice" aria-pressed="false" hidden>Mission control voice</button></nav>
</div></header>
<div class="wrap"><main id="main"></main></div>

M": 15, "caps": ["Images layering and buried rocks", "Finds ice lenses"], "benefit": "Fewer surprises when you dig foundations.", "fx": {"risk": -0.01}, "image": "art/gpr.jpg", "rec": true}, {"id": "prime", "label": "TRIDENT drill and MSolo", "kg": 40, "tags": ["prospecting"], "desc": "Lander-mounted 1 m drill with a mass spectrometer that sniffs the cuttings for volatiles.", "costM": 40, "caps": ["Drills 1 m from the lander", "Measures volatiles in cuttings"], "benefit": "Prospecting without needing a rover.", "image": "art/prime.jpg"}, {"id": "nss", "label": "Neutron Spectrometer System", "kg": 2, "tags": ["prospecting"], "desc": "Detects hydrogen, a sign of water ice, in the top metre of soil.", "costM": 10, "caps": ["Senses hydrogen to 1 m depth", "Works while driving"], "benefit": "A light way to map where ice is likely.", "image": "art/nss.jpg"}, {"id": "cone", "label": "Cone penetrometer and shear vane", "kg": 8, "tags": ["geotech"], "desc": "Measures bearing strength and cohesion of the regolith for pad and foundation design.", "costM": 10, "caps": ["Measures bearing strength", "Measures soil cohesion"], "benefit": "The numbers engineers need to design pads and foundations that do not settle.", "image": "art/cone.jpg", "rec": true}, {"id": "scalpss", "label": "SCALPSS plume cameras", "kg": 5, "tags": ["geotech"], "desc": "Stereo cameras that record how the engine plume erodes the surface.", "costM": 8, "caps": ["Films plume erosion in stereo", "Measures crater depth under the engine"], "benefit": "Sizes the pads and berms that heavy landers will need.", "fx": {"risk": -0.01}, "image": "art/scalpss.jpg", "rec": true}, {"id": "lra", "label": "Laser Retroreflector Array", "kg": 1, "tags": ["nav"], "desc": "Passive marker that later landers range against for precision landing.", "costM": 2, "caps": ["Passive laser target", "Lasts for decades"], "benefit": "Later landers range against it for more precise touchdowns.", "fx": {"risk": -0.02}, "image": "art/lra.jpg"}, {"id": "vertex", "label": "Lunar Vertex magnetometer suite", "kg": 30, "tags": ["science"], "desc": "Studies magnetic swirls. Good science, no help choosing a base site.", "costM": 30, "caps": ["Measures surface magnetic fields", "Studies solar wind interaction"], "benefit": "Good science. It does not help you build.", "image": "art/vertex.jpg"}, {"id": "metal", "label": "METAL helium-3 sensor", "kg": 12, "tags": ["science"], "desc": "Measures helium-3 abundance in the soil.", "costM": 15, "caps": ["Measures helium-3 in regolith"], "benefit": "Informs a future resource, not this base.", "image": "art/metal.jpg"}, {"id": "skylight", "label": "Skylight autonomous micro-rovers", "kg": 30, "costM": 30, "devCostM": 120, "devMonths": 24, "risk": 0.03, "tags": ["mobility", "mapping"], "fx": {"risk": -0.03}, "class": "Reliability", "niac": {"pi": "William Whittaker, Carnegie Mellon University", "year": "2019", "url": "https://www.nasa.gov/general/robotic-technologies-enabling-the-exploration-of-lunar-pits/"}, "desc": "NIAC concept: fast micro-rovers that explore on their own and build a high-resolution 3D model of rough terrain within one lunar day.", "caps": ["Autonomous exploration", "High-resolution 3D site model in about a week"], "benefit": "A detailed site model means fewer construction surprises, so every later operation is less likely to go wrong.", "image": "art/skylight.jpg"}, {"id": "ndl", "label": "Navigation Doppler Lidar landing sensor", "kg": 5, "costM": 15, "tags": ["nav"], "fx": {"risk": -0.03}, "class": "Reliability", "desc": "Laser sensor that measures a lander's speed and height precisely during descent. Flight-tested class of instrument.", "caps": ["Precise velocity and altitude during descent", "Works in darkness"], "benefit": "Landing data from this flight makes every later landing less likely to go wrong.", "image": "art/ndl.jpg", "rec": true}, {"id": "relay", "label": "Lunar relay user terminal", "kg": 10, "costM": 40, "tags": ["comms"], "fx": {"risk": -0.02, "monthsPct": -3}, "class": "Speed and reliability", "desc": "Radio terminal that talks to an orbiting relay, such as Lunar Pathfinder, when Earth is below the horizon.", "caps": ["Communication without direct line of sight to Earth", "Higher data rates"], "benefit": "Robots are supervised around the clock, so work goes a little faster and with fewer errors.", "image": "art/relay.jpg"}], "insight": {"text": "NASA's Phase One plans 25 launches and 21 landings to carry about 4 tonnes to the surface. VIPER and PROMISE both carry 1 m drills because the ice is expected below the surface, not on it.", "url": "https://abcnews.com/Technology/nasa-reveals-new-details-plan-build-base-moon/story?id=133325738"}, "real": "2026 to 2028: Moon Base I, II and III, VIPER late 2027, PROMISE late 2028", "still": "art/scout.jpg", "media": "art/scout.mp4"}, {"id": "mobility", "type": "loadout", "scene": "rover", "title": "Land the mobility fleet", "narration": "The base needs vehicles that can haul cargo and carry tools. NASA awarded Lunar Terrain Vehicle contracts worth $439 million to Astrolab and Lunar Outpost, with Blue Origin delivering them in 2028. Choose a delivery and the vehicles to send. You need at least one crew-class vehicle or larger. What you land here decides which options you get when the habitats arrive.", "videoPrompt": "Photorealistic six-limbed wheeled robot and an open lunar rover driving off a cargo lander at the lunar south pole, harsh side lighting, dust trails", "successText": "The vehicles drive off the deck and start their checkout traverses.", "failMonths": 6, "needs": [{"tag": "haul", "label": "Crew-class vehicle or larger"}], "carriers": [{"id": "mk1x2", "label": "Two Blue Moon Mark 1 cargo flights", "capKg": 6000, "months": 10, "desc": "NASA's task orders deliver the Lunar Terrain Vehicles this way in 2028.", "costM": 188, "risk": 0.15, "caps": ["6,000 kg across two landers", "Available on NASA's 2028 schedule"], "benefit": "Delivers the rovers NASA has already ordered.", "image": "art/mk1x2.jpg"}, {"id": "mk2c", "label": "Wait for Blue Moon Mark 2 cargo", "capKg": 30000, "months": 18, "desc": "Far more mass, but the lander is not ready for years.", "costM": 1800, "risk": 0.12, "caps": ["30,000 kg in one landing"], "benefit": "Carries the heaviest vehicles, years later.", "image": "art/mk2c.jpg"}], "items": [{"id": "flex", "label": "Astrolab CLV-1 Lunar Terrain Vehicle", "kg": 900, "tags": ["haul", "ltv"], "desc": "NASA contract $219 million. About 2,000 lb, over 6 mph, two suited crew or modular cargo pallets.", "costM": 219, "caps": ["Two suited crew", "Modular cargo pallets", "Drives itself between crews"], "benefit": "Hauls cargo and tools around the site without astronauts present.", "image": "art/flex.jpg"}, {"id": "pegasus", "label": "Lunar Outpost Pegasus Lunar Terrain Vehicle", "kg": 1200, "tags": ["haul", "ltv"], "desc": "NASA contract $220 million. Over 9 mph, built to operate for up to a year, two suited crew.", "costM": 220, "caps": ["Two suited crew", "Over 9 mph", "Built to run for a year"], "benefit": "A second, independent rover design, so one fault cannot stop surface transport.", "image": "art/pegasus.jpg"}, {"id": "racer", "label": "Intuitive Machines Moon RACER", "kg": 1200, "tags": ["haul", "ltv"], "desc": "A third proposed Lunar Terrain Vehicle design, with a towing trailer. Not selected by NASA.", "costM": 220, "caps": ["Two suited crew", "Tows a trailer"], "benefit": "Extra hauling capacity.", "image": "art/racer.jpg"}, {"id": "athlete", "label": "JPL ATHLETE", "kg": 2500, "tags": ["haul", "athlete", "tools"], "desc": "The largest option. Six wheeled limbs walk or roll, lift a whole habitat off a lander, and swap end effectors: gripper, drill, scoop, cable reel.", "costM": 450, "caps": ["Lifts a habitat off a tall lander", "Walks or rolls on six limbs", "Swaps tools: gripper, drill, scoop, cable reel"], "benefit": "Unlocks the fastest ways to move, connect and build, and shortens construction.", "image": "art/athlete.jpg"}, {"id": "lunarcruiser", "label": "JAXA pressurized rover", "kg": 10000, "tags": ["haul", "pressurized"], "desc": "NASA expects it in Phase Two. A mobile habitat for 28-day missions with resupply every 14 days. Too heavy for Mark 1.", "availableAt": {"y": 2029, "m": 6}, "costM": 900, "caps": ["Crew live aboard for 28 days", "Long-range traverses"], "benefit": "Extends crew reach far beyond walking distance and adds living space.", "quality": 5, "image": "art/lunarcruiser.jpg"}, {"id": "mapp2", "label": "MAPP rover swarm (3)", "kg": 30, "tags": ["scouts"], "desc": "Small scouts. They cannot haul cargo.", "costM": 40, "caps": ["Scout ahead of larger vehicles", "Relay communications"], "benefit": "Useful eyes on site. They cannot haul.", "image": "art/mapp2.jpg"}], "insight": {"text": "NASA bought two different Lunar Terrain Vehicles, from Astrolab and Lunar Outpost, for $439 million, so that one design problem cannot ground every crew. JPL built ATHLETE prototypes to unload cargo from tall landers.", "url": "https://www.nasa.gov/news-release/nasa-provides-update-on-moon-base-rovers-landers-missions/"}, "real": "2028: both Lunar Terrain Vehicles delivered", "still": "art/mobility.jpg", "media": "art/mobility.mp4"}, {"id": "site", "type": "choice", "scene": "orbit", "title": "Choose the base site", "narration": "Use the scouting data to place the base. You want near-continuous sunlight, a line of sight to Earth, flat ground for pads, and a short drive to water ice in permanently shadowed regions.", "videoPrompt": "Photorealistic orbital view of the lunar south pole, Shackleton crater in deep shadow, sunlit ridges, Earth low on the horizon", "options": [{"id": "ridge", "label": "Shackleton Connecting Ridge", "months": 3, "outcome": "ok", "grants": ["site"], "desc": "Where Moon Base I lands. Sunlit most of the year, with Shackleton and de Gerlache shadowed craters a few kilometres away on either side.", "resultText": "Site confirmed. Power towers on the ridge see the Sun most of the year and the ice is a short drive downhill.", "costM": 60, "quality": 3, "image": "art/ridge.jpg"}, {"id": "nobile", "label": "Nobile Rim (Mons Mouton)", "months": 4, "outcome": "ok", "grants": ["site"], "desc": "Broad, flat mountain top near small shadowed craters. VIPER's planned landing area.", "resultText": "Site confirmed. Flat ground makes pad building easy, with small cold traps close by.", "costM": 60, "quality": 2, "image": "art/nobile.jpg"}, {"id": "malapert", "label": "Malapert Massif", "months": 6, "outcome": "ok", "grants": ["site"], "desc": "Always in view of Earth for communications, but a long drive to large ice deposits.", "resultText": "Site confirmed. Communications are excellent. Ice runs take longer, so planning adds time.", "costM": 80, "image": "art/malapert.jpg"}, {"id": "floor", "label": "Floor of Shackleton crater", "months": 6, "outcome": "fail", "desc": "Sit directly on the ice.", "resultText": "The crater floor never sees the Sun or the Earth. At -334 °F the hardware freezes and you have no direct link home. The survey is redone.", "costM": 120, "image": "art/floor.jpg"}, {"id": "reiner", "label": "Reiner Gamma", "months": 6, "outcome": "fail", "desc": "A bright magnetic swirl on the near side, easy to reach. Moon Base III lands here for science.", "resultText": "It is an interesting place with no permanently shadowed regions and no water ice. The base cannot live off the land here. The survey is redone.", "costM": 120, "image": "art/reiner.jpg"}, {"id": "tranq", "label": "Mare Tranquillitatis", "months": 6, "outcome": "fail", "desc": "Flat, well-mapped equatorial plain.", "resultText": "Fourteen-day nights and no polar volatiles. The site fails the resource review and the survey is redone.", "costM": 120, "image": "art/tranq.jpg"}], "insight": {"text": "Moon Base I targets Shackleton Connecting Ridge. Sunlit ground there exceeds 130 °F while the crater floor beside it sits at -334 °F, and that cold is what has trapped the water ice.", "url": "https://www.nasa.gov/reference/moonbase-about/"}, "real": "Moon Base I targets Shackleton Connecting Ridge", "still": "art/site.jpg", "media": "art/site.mp4"}, {"id": "construct", "type": "loadout", "scene": "lander", "title": "Send construction and resource payloads", "narration": "Before heavy landers arrive you need machines on the surface to dig, to turn regolith into hard surfaces, and to power the work. Choose a delivery and payloads. You must cover excavation, surface construction and power. Resource processing is optional and risky.", "videoPrompt": "Photorealistic small robotic excavators with counter-rotating bucket drums unloading from a lunar cargo lander, solar tower deploying in the background", "successText": "The construction fleet is unloaded and the power tower is up.", "failMonths": 6, "needs": [{"tag": "excavate", "label": "Excavation"}, {"tag": "surface", "label": "Sintering or laser construction"}, {"tag": "power", "label": "Power"}], "carriers": [{"id": "mk1x2", "label": "Two Blue Moon Mark 1 cargo flights", "capKg": 6000, "months": 9, "desc": "Available now.", "costM": 400, "risk": 0.15, "caps": ["6,000 kg across two landers"], "benefit": "Enough for a lean construction fleet.", "image": "art/mk1x2.jpg"}, {"id": "mk2c", "label": "Blue Moon Mark 2 cargo", "capKg": 30000, "months": 14, "desc": "Carries everything, later.", "costM": 1800, "risk": 0.12, "caps": ["30,000 kg in one landing"], "benefit": "Carries every construction option at once.", "image": "art/mk2c.jpg"}], "items": [{"id": "rassor", "label": "RASSOR excavators (2)", "kg": 140, "tags": ["excavate"], "desc": "NASA Kennedy's bucket-drum diggers. Counter-rotating drums let a light robot dig in low gravity.", "costM": 60, "caps": ["Digs in low gravity with counter-rotating drums", "Hauls regolith"], "benefit": "Builds berms, trenches and the shielding cover.", "image": "art/rassor.jpg", "rec": true}, {"id": "ipex", "label": "ISRU Pilot Excavator (IPEx)", "kg": 30, "tags": ["excavate"], "desc": "Flight version of RASSOR sized for a pilot plant.", "costM": 30, "caps": ["Digs and delivers regolith", "Light enough for small landers"], "benefit": "A low-mass way to cover excavation.", "image": "art/ipex.jpg"}, {"id": "microwave", "label": "Microwave sintering paver", "kg": 600, "tags": ["surface", "sinter"], "desc": "Heats regolith in place until the grains fuse into a hard slab.", "costM": 150, "caps": ["Sinters regolith in place", "Makes a hard dust-free surface"], "benefit": "Turns loose soil into pads and roads with no binder brought from Earth.", "image": "art/microwave.jpg", "rec": true}, {"id": "solarsinter", "label": "Solar concentrator sintering rig", "kg": 400, "tags": ["surface", "sinter"], "desc": "Focuses sunlight to fuse interlocking paving tiles.", "costM": 100, "caps": ["Fuses paving tiles with sunlight", "Low power draw"], "benefit": "Paving that runs on sunlight alone.", "image": "art/solarsinter.jpg"}, {"id": "laser", "label": "Laser regolith 3D printer", "kg": 900, "tags": ["surface", "laser"], "desc": "High-power laser melts regolith layer by layer into pads, walls and berms.", "costM": 250, "caps": ["Melts regolith layer by layer", "Prints pads, walls and vault blocks"], "benefit": "The fastest surface construction, and it unlocks a printed vault over the habitat.", "image": "art/laser.jpg", "rec": true}, {"id": "lasermfg", "label": "Laser powder-bed manufacturing cell", "kg": 500, "tags": ["spares"], "desc": "Prints metal and regolith-ceramic spare parts on site.", "costM": 150, "caps": ["Prints metal and ceramic spare parts", "Repairs tools on site"], "benefit": "Shortens construction because broken parts are replaced in days.", "quality": 4, "image": "art/lasermfg.jpg"}, {"id": "minicast", "label": "miniCAST solar and comms tower", "kg": 800, "tags": ["power"], "desc": "NASA's kit of Redwire solar arrays, Honeybee Robotics batteries and Yank Technologies wireless power for rovers.", "costM": 200, "caps": ["Solar power tower", "Battery storage", "Wireless power to rovers"], "benefit": "Stored power ends night dormancy for the construction fleet.", "image": "art/minicast.jpg", "rec": true}, {"id": "lsms", "label": "LSMS crane", "kg": 300, "tags": ["crane"], "desc": "NASA Langley's Lightweight Surface Manipulation System. Lifts cargo off lander decks.", "costM": 80, "caps": ["Lifts cargo off lander decks", "Light truss boom"], "benefit": "Unlocks moving the habitat by rover and trailer.", "image": "art/lsms.jpg", "rec": true}, {"id": "carbothermal", "label": "Carbothermal oxygen reactor", "kg": 700, "tags": ["oxygen"], "desc": "Extracts oxygen from regolith with methane and concentrated heat.", "costM": 200, "caps": ["Extracts oxygen from regolith"], "benefit": "Breathing oxygen made on site raises the quality of the base.", "quality": 5, "image": "art/carbothermal.jpg"}, {"id": "icemine", "label": "Ice mining thermal extractor", "kg": 500, "tags": ["water"], "desc": "Heated drill that drives water vapour out of shadowed-region soil and traps it.", "costM": 180, "caps": ["Extracts water from shadowed soil"], "benefit": "Water for crew and shielding, made on site.", "quality": 6, "image": "art/icemine.jpg"}, {"id": "mre", "label": "Molten Regolith Electrolysis reactor", "kg": 900, "tags": ["oxygen", "metals"], "outcome": "fail", "failMonths": 9, "scene": "boom", "desc": "Melts regolith at 1,600 °C and splits it into oxygen and metals. Highest yield on paper.", "failText": "The molten pool eats through the electrode seal. The reactor ruptures and sprays slag across the lander and the payloads beside it. The delivery is lost.", "costM": 300, "caps": ["Extracts oxygen and metals from molten regolith"], "benefit": "The highest yield on paper.", "image": "art/mre.jpg", "art": {"still": "art/out_mre.jpg", "media": "art/out_mre.mp4"}}, {"id": "float", "label": "FLOAT levitating cargo track", "kg": 800, "costM": 200, "devCostM": 600, "devMonths": 36, "risk": 0.03, "tags": ["transport"], "fx": {"monthsPct": -15}, "quality": 5, "class": "Speed", "niac": {"pi": "Ethan Schaler, NASA JPL", "year": "2024", "url": "https://www.nasa.gov/general/flexible-levitation-on-a-track-float/"}, "desc": "NIAC concept: unpowered magnetic robots levitate over a flexible film track that unrolls across the regolith, with no wheels or legs to wear out in dust.", "caps": ["Moves 100,000s of kg of regolith several kilometres a day", "Carries over 30 kg per square metre at over 0.5 m/s", "Track rolls up and can be re-laid"], "benefit": "Regolith and cargo move without rover trips, so every later stage is 15% faster.", "image": "art/float.jpg"}, {"id": "lightbender", "label": "Light Bender sunlight relay", "kg": 600, "costM": 150, "devCostM": 400, "devMonths": 30, "risk": 0.03, "tags": ["power"], "fx": {"monthsPct": -5}, "quality": 4, "class": "Speed and quality", "niac": {"pi": "Charles Taylor, NASA Langley", "year": "2021", "url": "https://www.nasa.gov/general/light-bender/"}, "desc": "NIAC concept: a heliostat on a sunlit rim concentrates sunlight and a lens sends it kilometres to small solar arrays in shadow.", "caps": ["Captures almost 48 kW of sunlight", "At least 9 kW continuous within 1 km", "About 5 times lighter than cables or laser beaming"], "benefit": "Counts as power for the fleet, ends night dormancy, and lets robots work inside shadowed areas.", "image": "art/lightbender.jpg"}, {"id": "thermalmine", "label": "Thermal ice mining dome", "kg": 500, "costM": 150, "devCostM": 350, "devMonths": 30, "risk": 0.03, "tags": ["water"], "quality": 8, "class": "Quality", "niac": {"pi": "George Sowers, Colorado School of Mines", "year": "2019", "url": "https://www.nasa.gov/general/thermal-mining-of-ices-on-cold-solar-system-bodies/"}, "desc": "NIAC concept: heat the icy ground with sunlight or buried heaters, catch the vapour under a dome and refreeze it in cold traps. No digging.", "caps": ["Extracts water without excavation", "About 60% less mass and energy than digging"], "benefit": "A steady water supply for crew, shielding and propellant raises the quality of the base.", "image": "art/thermalmine.jpg"}, {"id": "eds", "label": "Electrodynamic dust shields", "kg": 20, "costM": 30, "tags": ["dust"], "fx": {"risk": -0.03}, "quality": 2, "class": "Reliability", "desc": "Transparent electrode coatings that throw dust off radiators, solar panels, cameras and seals. Flight-tested class of technology.", "caps": ["Clears dust with no moving parts", "Protects optics, radiators and seals"], "benefit": "Dust is the main cause of worn mechanisms, so every later operation is less likely to go wrong.", "image": "art/eds.jpg", "rec": true}, {"id": "cadre", "label": "Cooperative autonomy for the robot fleet", "kg": 30, "costM": 60, "tags": ["autonomy"], "fx": {"monthsPct": -6}, "class": "Speed", "desc": "Software and radios that let robots share a map and divide tasks among themselves with no step-by-step commands from Earth.", "caps": ["Robots plan and share tasks", "Keeps working through communication gaps"], "benefit": "Less waiting for commands, so every later stage is 6% faster.", "image": "art/cadre.jpg", "rec": true}, {"id": "nde", "label": "Construction inspection sensors", "kg": 25, "costM": 30, "tags": ["inspection"], "fx": {"risk": -0.04}, "quality": 4, "class": "Reliability and quality", "desc": "Laser profilometer, thermal camera and ultrasonic probes that check each sintered or printed layer as it is made.", "caps": ["Finds cracks and voids in sintered regolith", "Verifies flatness and thickness"], "benefit": "Defects are caught before a lander or habitat sits on them, and the finished base is better built.", "image": "art/nde.jpg"}], "insight": {"text": "NASA's first power kit, miniCAST, is solar arrays, batteries and wireless power, and a larger integrated power system goes out for bids in early 2027. Power comes before construction in the real plan too.", "url": "https://www.nasa.gov/news-release/nasa-awards-moon-base-transportation-technology-science-projects/"}, "real": "2027 onward: integrated power system solicitation", "still": "art/construct.jpg", "media": "art/construct.mp4"}, {"id": "build", "type": "choice", "scene": "build", "title": "Build pads, roads and foundations", "narration": "Your landers and robots now build the ground infrastructure. A 100-tonne lander's exhaust throws regolith at more than a kilometre per second, so what you build here protects everything that follows.", "videoPrompt": "Photorealistic robots sintering a circular landing pad on the Moon, glowing regolith under a laser, berms, a graded road leading to the horizon", "options": [{"id": "full", "label": "Landing pad with blast berm, then road, then habitat foundations", "months": 13, "outcome": "ok", "grants": ["pad", "road", "foundation"], "modifiers": [{"has": "athlete", "months": -3}, {"has": "laser", "months": -2}, {"has": "spares", "months": -1}], "desc": "The complete job. ATHLETE, a laser printer and on-site spares each shorten it.", "resultText": "A sintered pad with a blast berm, a graded road and level foundations are finished.", "costM": 1200, "risk": 0.1, "quality": 2}, {"id": "twopads", "label": "Two pads, road and foundations", "months": 18, "outcome": "ok", "grants": ["pad", "road", "foundation"], "modifiers": [{"has": "athlete", "months": -4}, {"has": "laser", "months": -3}], "desc": "A second pad gives a backup, at a cost in time.", "resultText": "Two pads, a road and foundations are finished. Landings no longer depend on one surface.", "costM": 1700, "risk": 0.08, "quality": 6}, {"id": "padonly", "label": "Pad only, skip the road and foundations", "months": 17, "outcome": "setback", "desc": "Get the heavy landers down sooner.", "resultText": "The pad works, but vehicles bog down in loose regolith and there is nowhere level to set a habitat. The team goes back and finishes the road and foundations, ten months later than a single campaign would have taken.", "costM": 1200, "grants": ["pad", "road", "foundation"]}, {"id": "nopad", "label": "Skip the pad and land on bare regolith", "months": 7, "outcome": "fail", "scene": "boom", "desc": "Apollo did it.", "resultText": "The heavy lander's plume digs a crater under itself and sandblasts the construction fleet. Repairs and a rebuilt site cost you most of a year.", "costM": 900, "art": {"still": "art/out_nopad.jpg", "media": "art/out_nopad.mp4"}}], "insight": {"text": "NASA flies SCALPSS plume cameras on Moon Base I to measure how engine exhaust erodes the surface. That data sizes the pads and berms that heavy landers will need.", "url": "https://www.nasa.gov/news-release/nasa-provides-update-on-moon-base-rovers-landers-missions/"}, "real": "Not yet dated by NASA", "still": "art/build.jpg", "media": "art/build.mp4"}, {"id": "cargo", "type": "loadout", "scene": "cargo", "title": "Land the heavy cargo", "narration": "The pads are ready for the big landers. NASA's Phase Three, from 2032, brings larger permanent habitats and nuclear power, with equipment from Italy and Canada. Choose Blue Origin's Blue Moon Mark 2, SpaceX's Starship, or both, and load them. The base needs a fission reactor, a habitat, the cabling to join them, and supplies.", "videoPrompt": "Photorealistic SpaceX Starship lunar lander touching down on a sintered landing pad at the lunar south pole, Blue Moon Mark 2 lander in the distance, dramatic low sun", "successText": "Touchdown on the pad. The blast berm does its job and the cargo is intact.", "failMonths": 6, "needs": [{"tag": "reactor", "label": "Fission reactor"}, {"tag": "habitat", "label": "Habitat"}, {"tag": "cable", "label": "Power cabling"}, {"tag": "supplies", "label": "Supplies"}], "carriers": [{"id": "mk2", "label": "Blue Moon Mark 2 cargo", "capKg": 30000, "months": 10, "desc": "About 30 tonnes one way.", "costM": 1800, "risk": 0.1, "caps": ["30,000 kg one way", "Cargo deck near the ground"], "benefit": "Enough for a lean base itted on Earth", "Multiple decks"], "benefit": "A permanent habitat that raises the quality of the base.", "quality": 10, "image": "art/rigid.jpg"}, {"id": "cable", "label": "Power cable reels and radiators", "kg": 1500, "tags": ["cable"], "desc": "A kilometre of cable to keep the reactor at a safe distance.", "costM": 150, "caps": ["1 km of power cable", "Radiators for the reactor"], "benefit": "Lets the reactor sit at a safe distance.", "image": "art/cable.jpg"}, {"id": "logistics", "label": "Logistics and supplies", "kg": 8000, "tags": ["supplies"], "desc": "Food, water, air, spares and suits for the first crew.", "costM": 400, "caps": ["Food, water, air, suits and spares"], "benefit": "Without it the crew cannot stay.", "quality": 2, "image": "art/logistics.jpg"}, {"id": "airlock", "label": "Airlock and suitport module", "kg": 4000, "tags": ["airlock"], "desc": "Keeps dust out of the habitat.", "costM": 400, "caps": ["Suitports keep dust outside", "Faster crew egress"], "benefit": "Cleaner air and less wear inside the habitat.", "quality": 6, "image": "art/airlock.jpg"}, {"id": "solarfarm", "label": "Solar array farm", "kg": 3000, "tags": ["power"], "desc": "Extra daytime power. Not a substitute for the reactor in the long polar shadows.", "costM": 300, "caps": ["Extra daytime power"], "benefit": "Margin for science and charging.", "quality": 3, "image": "art/solarfarm.jpg"}, {"id": "prover", "label": "JAXA pressurized rover", "kg": 10000, "tags": ["pressurized", "haul"], "desc": "Mobile habitat for long traverses.", "availableAt": {"y": 2029, "m": 6}, "costM": 900, "caps": ["Crew live aboard for 28 days"], "benefit": "Adds mobile living space.", "quality": 5, "image": "art/lunarcruiser.jpg"}, {"id": "myco", "label": "Mycotecture grown habitat annex", "kg": 1500, "costM": 300, "devCostM": 500, "devMonths": 36, "risk": 0.03, "tags": ["annex"], "quality": 10, "class": "Quality", "niac": {"pi": "Lynn Rothschild, NASA Ames", "year": "2024, Phase III", "url": "https://www.nasa.gov/general/mycotecture-off-planet-en-route-to-the-moon-and-mars/"}, "desc": "NIAC concept: a light frame and fungal mycelium arrive dormant, and the fungus grows into the walls and furniture of extra rooms. It adds to a habitat and does not replace one.", "caps": ["Grows structure on site from a small launch mass", "Technology readiness 3, aiming for 6 with a lander demonstration"], "benefit": "More living and working volume than you could launch, which raises the quality of the base.", "image": "art/myco.jpg"}, {"id": "lspop", "label": "Lunar South Pole Oxygen Pipeline", "kg": 2000, "costM": 250, "devCostM": 500, "devMonths": 36, "risk": 0.03, "tags": ["pipeline"], "quality": 8, "class": "Quality", "niac": {"pi": "Peter Curreri, Lunar Resources", "year": "2023, Phase I", "url": "https://www.nasa.gov/general/lunar-south-pole-oxygen-pipeline/"}, "desc": "NIAC concept: a 5 km gas pipeline, built by robots from aluminium made on the Moon, carries oxygen from where it is extracted to storage beside the base.", "caps": ["About 2 kg of oxygen an hour", "Sized for 10,000 kg a year", "Designed to last over 10 years"], "benefit": "Oxygen arrives without rover tanker runs, which raises the quality of the base.", "image": "art/lspop.jpg"}, {"id": "cryo", "label": "Solar White cryogenic coating", "kg": 100, "costM": 40, "devCostM": 150, "devMonths": 24, "risk": 0.03, "tags": ["storage"], "quality": 5, "class": "Quality", "niac": {"pi": "Robert Youngquist, NASA Kennedy", "year": "2016, Phases I and II", "url": "https://www.nasa.gov/general/cryogenic-selective-surfaces/"}, "desc": "NIAC concept: a coating predicted to reflect more than 99.9% of sunlight, so tanks of liquid oxygen stay cold with no refrigeration. Theoretical so far.", "caps": ["Predicted to reflect over 99.9% of sunlight", "Passive storage of liquid oxygen"], "benefit": "Stored oxygen and propellant do not boil away, which raises the quality of the base.", "image": "art/cryo.jpg"}], "insight": {"text": "Both crew landers must complete an uncrewed landing before they carry astronauts. Larger habitats and nuclear power are Phase Three items, from 2032.", "url": "https://abcnews.com/Technology/nasa-unveils-ambitious-20-billion-moon-base-strategy/story?id=131361493"}, "real": "2032 onward: Phase Three habitats and nuclear power", "still": "art/cargo.jpg", "media": "art/cargo.mp4"}, {"id": "move", "type": "choice", "scene": "habitat", "title": "Move the habitat", "narration": "The habitat is sitting on top of a lander on the pad. It has to reach its foundation. Your options depend on the vehicles you landed.", "videoPrompt": "Photorealistic six-limbed ATHLETE robot carrying a cylindrical habitat along a sintered lunar road, tall lander behind it", "options": [{"id": "athlete", "label": "ATHLETE lifts and walks it over", "months": 3, "outcome": "ok", "requires": ["athlete"], "grants": ["placed"], "desc": "Two three-limbed halves dock under the habitat, lift it clear and carry it down the road.", "resultText": "ATHLETE sets the habitat on its foundation and levels it with its limbs.", "costM": 40, "risk": 0.05, "quality": 2, "image": "art/athlete.jpg"}, {"id": "ltvcrane", "label": "Crane it onto a Lunar Terrain Vehicle trailer", "months": 6, "outcome": "ok", "requires": ["ltv", "crane"], "grants": ["placed"], "desc": "The LSMS crane lowers the habitat to a trailer and the rover tows it along the road.", "resultText": "Slow and careful, but the habitat is on its foundation.", "costM": 60, "risk": 0.12}, {"id": "skid", "label": "Winch it on a skid", "months": 8, "outcome": "ok", "grants": ["placed"], "desc": "Works with any vehicle. Takes many short pulls and a lot of anchoring.", "resultText": "After months of short pulls the habitat reaches its foundation.", "costM": 80, "risk": 0.25}, {"id": "stay", "label": "Leave it on the lander", "months": 5, "outcome": "fail", "desc": "Use the lander as the base.", "resultText": "Tens of metres up, the habitat cannot be shielded and blocks the only pad. The plan is rejected and the move is redone.", "costM": 60}], "insight": {"text": "Starship's cargo comes down an elevator from tens of metres up, and Blue Moon Mark 2 keeps its payload low. How cargo gets off the lander shapes every vehicle NASA is buying.", "url": "https://www.nasa.gov/reference/human-landing-systems/"}, "real": "Not yet dated by NASA", "still": "art/move.jpg", "media": "art/move.mp4"}, {"id": "connect", "type": "choice", "scene": "reactor", "title": "Place the reactor and connect power", "narration": "The fission reactor has to power the habitat without irradiating the crew. Decide where it goes and how it is connected.", "videoPrompt": "Photorealistic lunar fission reactor with tall radiator panels behind a regolith berm, robot laying power cable toward a distant habitat", "options": [{"id": "far", "label": "One kilometre away behind a berm, with ATHLETE laying cable", "months": 3, "outcome": "ok", "requires": ["athlete"], "grants": ["powered"], "desc": "ATHLETE swaps to its cable-reel end effector.", "resultText": "The reactor goes critical behind its berm and the habitat lights up.", "costM": 80, "risk": 0.05, "quality": 3}, {"id": "farltv", "label": "One kilometre away behind a berm, with a rover laying cable", "months": 5, "outcome": "ok", "requires": ["haul"], "grants": ["powered"], "desc": "A rover tows the cable reel while excavators trench.", "resultText": "The reactor goes critical behind its berm and the habitat lights up.", "costM": 100, "risk": 0.1, "quality": 3}, {"id": "near", "label": "Next to the habitat to save cable", "months": 6, "outcome": "fail", "desc": "Shortest run, fastest job.", "resultText": "Radiation at the habitat wall is far over the crew limit. The reactor has to be shut down, cooled and moved.", "costM": 150}, {"id": "solar", "label": "Leave the reactor off and run on solar", "months": 9, "outcome": "setback", "desc": "Skip the nuclear work.", "resultText": "The first long shadow period drains the batteries and the habitat freezes. Systems are repaired and the reactor is installed after all, at a safe distance.", "costM": 120, "grants": ["powered"]}], "insight": {"text": "NASA's Fission Surface Power design runs for years with no sunlight, which is why it is the Phase Three answer to long polar shadows. Reactors sit far from habitats and behind terrain for shielding.", "url": "https://www.nasa.gov/tdm/fission-surface-power/"}, "real": "2032 onward: Phase Three", "still": "art/connect.jpg", "media": "art/connect.mp4"}, {"id": "shield", "type": "choice", "scene": "shield", "title": "Shield the habitat", "narration": "With no atmosphere or magnetic field, the crew needs mass overhead against solar storms and cosmic rays. Cover the habitat with regolith.", "videoPrompt": "Photorealistic small excavator robots piling regolith over a lunar habitat until only the airlock shows, time-lapse feel", "options": [{"id": "berm", "label": "Bury it under 2 to 3 metres of loose regolith", "months": 6, "outcome": "ok", "requires": ["excavate"], "grants": ["shielded"], "desc": "Excavators haul and dump regolith over a support shell.", "resultText": "Only the airlock shows. The crew dose inside is cut to a fraction of the surface rate.", "costM": 120, "risk": 0.08, "quality": 4}, {"id": "arch", "label": "Build a sintered regolith vault over it", "months": 8, "outcome": "ok", "requires": ["surface"], "grants": ["shielded"], "desc": "Sintered or laser-printed blocks form an arch that is then covered. Stronger and easier to maintain.", "resultText": "A fused regolith vault stands over the habitat, covered with loose soil.", "costM": 200, "risk": 0.05, "quality": 8}, {"id": "thin", "label": "A thin 30 cm layer", "months": 9, "outcome": "setback", "desc": "Quicker.", "resultText": "A thin layer makes secondary radiation worse, not better. The flight surgeons refuse to certify the base, so the excavators go back and pile on another two metres.", "costM": 100, "grants": ["shie er", "More than twice as deep as the Grand Canyon and believed to hold ice", "https://www.nasa.gov/reference/moonbase-about/"]], "budgetM": 20000, "night": {"pct": 20, "tags": ["nuclear", "power", "reactor"], "text": "Lunar night: with no nuclear or stored power on the surface, your robots sleep through the dark periods."}, "whatifs": [{"id": "starship", "label": "Starship cargo slips two years", "desc": "Orbital refuelling takes longer than planned. Starship cargo flights are not ready until 2034.", "carrierReady": {"starship": {"y": 2034, "m": 1}, "both": {"y": 2034, "m": 1}}}, {"id": "clps", "label": "CLPS 2 is cancelled", "desc": "No new small-lander awards. Every delivery takes 25% longer and the budget loses the $10 billion framework's slack.", "monthsPct": 25, "budgetDeltaM": -3000}, {"id": "budget", "label": "Congress funds $15 billion, not $20 billion", "desc": "A quarter of the budget is gone before you start.", "budgetDeltaM": -5000}, {"id": "china", "label": "China finishes a year early", "desc": "The rival station is declared complete at the end of 2034.", "deadlineShift": -12}, {"id": "risk", "label": "Rough decade for landers", "desc": "Every landing and operation is 10 points more likely to go wrong.", "riskAdd": 0.1}], "rival": {"name": "China", "milestones": [{"y": 2026, "m": 8, "label": "Chang'e-7 surveys the south pole"}, {"y": 2029, "m": 1, "label": "Chang'e-8 tests building with regolith"}, {"y": 2030, "m": 12, "label": "First Chinese crew lands"}, {"y": 2035, "m": 12, "label": "Research station complete"}]}, "budgetYears": 7, "budgetSource": "https://www.cbsnews.com/news/nasa-moon-base-plan-lunar-south-pole/", "quality": {"grades": [[0, "Bare outpost"], [15, "Working outpost"], [35, "Permanent base"], [60, "Thriving settlement"]], "wearPenalty": 3}, "art": {"fail": {"still": "art/out_fail.jpg", "media": "art/out_fail.mp4"}, "win": {"still": "art/out_win.jpg", "media": "art/out_win.mp4"}, "loss": {"still": "art/out_loss.jpg", "media": "art/out_ function dateAt(mo){const t=SCN.start.y*12+SCN.start.m-1+mo;return MONTHS[t%12]+" "+Math.floor(t/12)}

/* ---------- capabilities, effects, development, quality ---------- */

function devTxt(o){return "Still in development: adds "+fm(o.devCostM||0)+", charged once, and cannot fly before "+dateAt(o.devMonths||0)+" ("+pl(o.devMonths||0)+" of development from the program start; both are estimates)."+(o.niac?" NASA NIAC "+o.niac.year+", "+o.niac.pi+".":"")}
function capKids(o){return [(o.caps||[]).length?h("small",{class:"cap",text:"Can: "+o.caps.join(" · ")}):null,o.benefit?h("small",{class:"ben",text:o.benefit}):null,fxList(o).length?h("small",{class:"fx",text:fxList(o).join(". ")+"."}):null,(o.devCostM||o.devMonths)?h("small",{class:"dev",text:G.dev.includes(o.id)?"Development already paid for.":devTxt(o)}):null,o.risk&&o.kg!=null?h("small",{class:"r",text:"Unproven: +"+pts(Math.round(o.risk*100))+" of mishap chance on this delivery."}):null]}
/* ---------- art: links first, uploaded copies when the page has them ---------- */

function artUrl(u){if(!u)return null;const j=jobOf(u);if(j&&ART[j])return "/_blob/"+ART[j];return BAD.has(u)?null:u}
function artEl(tag,u,attrs,onok){const src=artUrl(u);if(!src)return null;const e=h(tag,Object.assign({src},attrs||{}));const ext=src===u;e.addEventListener(tag==="video"?"loadeddata":"load",()=>{e.classList.add("ok");if(onok)onok()});e.addEventListener("error",()=>{BAD.add(src);e.remove()});return e}
function thumb(o){const a=[].concat(o.image||[]).map(u=>artEl("img",u,{class:"th",alt:"",loading:"lazy"})).filter(Boolean);return a.length?h("span",{class:"ths"},a):null}
/* ---------- shareable result ---------- */
let SHARED=null;const showAll={};
function shareLink(won){const d={v:1,w:won?1:0,m:G.months,s:G.spent,q:qScore(),p:G.picks};let base=(!window.claude&&/^https?:/.test(location.protocol))?location.href.split("#")[0]:(SCN.shareUrl||"");return base?base+"#r="+encodeURIComponent(btoa(JSON.stringify(d))):""}
function readShare(){try{const m=/[#&]r=([^&]+)/.exec(location.hash||"");if(!m)return null;const d=JSON.parse(atob(decodeURIComponent(m[1])));const ids=(LIVE.whatifs||[]).map(w=>w.id);return {w:!!d.w,m:Math.max(0,Math.min(600,Math.round(+d.m)||0)),s:Math.max(0,Math.round(+d.s)||0),q:Math.max(0,Math.min(999,Math.round(+d.q)||0)),p:(Array.isArray(d.p)?d.p:[]).filter(x=>ids.includes(x))}}catch(e){return null}}

/* ---------- sound and voice ---------- */
let soundOn=ls.get("mb-sound")==="1",voiceOn=false,tts=null,actx=null,spoken="";
function tone(f,d,type,when){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+(when||0);o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={go(){tone(2525,.25);tone(2475,.25,"sine",.3)},bad(){tone(110,.7,"sawtooth");tone(82,.9,"sawtooth",.15)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.6,"triangle",i*.18))}};
function say(key,text){if(!voiceOn||!tts||spoken===key)return;spoken=key;try{tts.speak(text.slice(0,1900)).catch(()=>{})}catch(e){}}

/* ---------- header ---------- */
function drawClock(){
  $("cDate").textContent=dateAt(G.months);$("cEl").textContent=dur(G.months);$("cCn").textContent=dateAt(totalMonths());
  $("cBud").textContent=fm(funds())+" of "+fm(released(G.months))+" released";
  const T=totalMonths(),pct=m=>Math.max(0,Math.min(100,m/T*100)),race=$("tl");race.textContent="";
  const you=h("div",{class:"rb"},h("div",{class:"track"}),h("div",{class:"fill",style:"width:"+pct(G.months)+"%"}));
  for(const m of SCN.markers||[]){const mo=moOf(m);if(mo>0&&mo<T)you.append(h("div",{class:"mk",style:"left:"+pct(mo)+"%",title:m.label}))}
  const cn=h("div",{class:"rb cn"},h("div",{class:"track"}),h("div",{class:"fill",style:"width:"+pct(G.months)+"%"}));
  const rms=(SCN.rival&&SCN.rival.milestones)||[];let next=null;
  for(const m of rms){const mo=moOf(m);if(mo<0)continue;const hit=G.months>=mo;if(!hit&&!next)next=m;cn.append(h("div",{class:"mk"+(hit?" hit":""),style:"left:calc("+pct(mo)+"% - "+(mo>=T?3:0)+"px)",title:m.label}))}
  race.append(h("span",{text:"You"}),you,h("span",{text:(SCN.rival&&SCN.rival.name)||"Rival"}),cn);
  const nm=(SCN.markers||[]).find(m=>moOf(m)>G.months);
  $("tln").textContent="";if(nm)$("tln").append(h("span",{text:"Next for NASA: "+nm.label+", "+nm.y}));if(next)$("tln").append(h("span",{},"Next for "+SCN.rival.name+": ",h("b",{text:next.label+", "+MONTHS[next.m-1]+" "+next.y})));
}
const EXPLORER="timeline.html";
/* ---------- cutscene painter (placeholder until video clips are attached) ---------- */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let scene="lander",sceneT0=performance.now(),cv=null,raf=0;
const STARS=Array.from({length:140},(_,i)=>[(i*97.13)%1,(i*57.77)%0.62,((i*31)%7)/7]);
function setScene(s){scene=s;sceneT0=performance.now()}
function paint(now){
  raf=0;if(!cv||!cv.isConnected)return;
  const w=cv.width,hh=cv.height,c=cv.getContext("2d"),t=reduce?3:(now-sceneT0)/1000,u=w/640;
  c.fillStyle="#020308";c.fillRect(0,0,w,hh);
  for(const s of STARS){c.fillStyle="rgba(255,255,255,"+(0.3+0.7*s[2])+")";c.fillRect(s[0]*w,s[1]*hh,u*(1+s[2]),u*(1+s[2]))}
  if(scene==="orbit"||scene==="flag"){ // moon from orbit
    const R=hh*0.62,cx=w/2,cy=hh*0.95;const g=c.createRadialGradient(cx-R*.4,cy-R*.6,R*.1,cx,cy,R);g.addColorStop(0,"#d8d4c8");g.addColorStop(.7,"#77746c");g.addColorStop(1,"#15151a");
    c.fillStyle=g;c.beginPath();c.arc(cx,cy,R,0,7);c.fill();
    for(let i=0;i<16;i++){const a=i*2.4,r=R*(0.15+((i*37)%50)/70),x=cx+Math.cos(a)*r,y=cy-Math.abs(Math.sin(a))*r*0.9;c.fillStyle="rgba(0,0,0,"+(0.25+(i%3)*0.15)+")";c.beginPath();c.ellipse(x,y,R*(0.03+(i%4)*0.02),R*(0.02+(i%4)*0.012),0,0,7);c.fill()}
    if(scene==="orbit"){c.strokeStyle="#f2b84b";c.lineWidth=2*u;c.setLineDash([6*u,6*u]);c.beginPath();c.arc(cx,cy-R*.72,R*.12,0,7);c.stroke();c.setLineDash([]);const a=t*0.6;c.fillStyle="#fff";c.fillRect(cx+Math.cos(a)*R*1.1-3*u,cy-R*.75+Math.sin(a)*R*.12,6*u,3*u)}
    else{ // flag passes over the Moon
      const fx=((t*0.11)%1.4-0.2)*w,fy=hh*0.2,fw=220*u,fh=140*u;c.save();c.translate(fx-fw/2,fy);
      c.fillStyle="#de2910";c.beginPath();for(let x=0;x<=fw;x+=4){const y=Math.sin(x/28/u+t*3)*5*u;x?c.lineTo(x,y):c.moveTo(x,y)}for(let x=fw;x>=0;x-=4)c.lineTo(x,fh+Math.sin(x/28/u+t*3)*5*u);c.fill();
      c.fillStyle="#ffde00";star(c,fw*.17,fh*.27,fh*.15);[[.33,.1],[.4,.2],[.4,.35],[.33,.45]].forEach(p=>star(c,fw*p[0],fh*p[1],fh*.05));c.restore();
      c.fillStyle="rgba(0,0,0,.35)";c.beginPath();c.ellipse(fx,cy-R*.75,fw*.5,22*u,0,0,7);c.fill()}
  }else{ // surface view
    const ex=w*.8,ey=hh*.2;c.fillStyle="#3d7fd6";c.beginPath();c.arc(ex,ey,16*u,0,7);c.fill();c.fillStyle="rgba(255,255,255,.6)";c.beginPath();c.arc(ex-4*u,ey-3*u,7*u,0,7);c.fill();c.fillStyle="#020308";c.beginPath();c.arc(ex+9*u,ey,16*u,0,7);c.fill();
    const hz=hh*.66;c.fillStyle="#2a2a2e";c.beginPath();c.moveTo(0,hz);for(let x=0;x<=w;x+=w/40)c.lineTo(x,hz-18*u*Math.abs(Math.sin(x/w*7+1))-10*u*Math.sin(x/w*23));c.lineTo(w,hh);c.lineTo(0,hh);c.fill();
    const g=c.createLinearGradient(0,hz,0,hh);g.addColorStop(0,"#8f8b80");g.addColorStop(1,"#3a3833");c.fillStyle=g;c.fillRect(0,hz+6*u,w,hh);
    for(let i=0;i<9;i++){c.fillStyle="rgba(0,0,0,.28)";c.beginPath();c.ellipse(((i*173)%600+20)*u,hz+(30+(i*41)%90)*u,(14+i*3)*u,(3+i*.7)*u,0,0,7);c.fill()}

  for(const k of ["fail","win","loss"]){const a=(LIVE.art||{})[k];if(a){put("out_"+k+".png",a.still);put("out_"+k+".mp4",a.media)}}return m}
