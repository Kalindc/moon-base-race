name: Check and build the game

on:
  pull_request:
  push:
    branches: [main]
    paths: ["scenario.json", "src/**", "build.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check scenario.json and build index.html and timeline.html
        run: python3 build.py
      - name: Commit the rebuilt game
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- index.html timeline.html; then
            echo "Game is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html timeline.html
            git commit -m "Rebuild game from scenario.json"
            git push
          fi
